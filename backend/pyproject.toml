[project]
name = "ai-trading-lab"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "pydantic-settings", "pandas", "numpy", "pyarrow", "duckdb", "backtrader", "exchange-calendars", "httpx", "xgboost-cpu", "scikit-learn", "gymnasium"]
[project.optional-dependencies]
dev = ["pytest", "ruff"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
line-length = 110